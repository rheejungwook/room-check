const KEY='roomCheck.v1';
const SUP=[['b','검정',12],['bl','파랑',6],['r','빨강',6],['e','지우개',1]];
const REASONS=['회의중','용도 변경','프로젝트','출입 제한','기타'];
const rKind=r=>REASONS.includes(r.reason)?r.reason:(r.reason?'기타':'');
let S=null,view={page:'home',floor:null};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
/* 사옥별 회의실 정보: 등록된 사옥만 목록이 나와요. 다른 사옥은 점검표 엑셀을 업로드하면 반영돼요. */
const SITE_SEED={'그린팩토리':SEED};
const roomsFromSeed=arr=>arr.map((l,i)=>{const [f,n,c]=l.split('|');return{id:i+1,floor:+f,name:n,corp:c||'',st:'',reason:'',sup:{},memo:'',by:'',at:''}});
function seedState(){
  const rooms=roomsFromSeed(SEED);
  return{site:'',siteSet:false,who:'',mine:[],onlyMine:true,rooms,nid:rooms.length+1,ym:today().slice(0,7),stash:{}};
}
let storeOk=true;
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);S.onlyMine=true;return}}catch(e){storeOk=false}S=seedState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOk=true}catch(e){storeOk=false}}
const floors=()=>[...new Set(S.rooms.map(r=>r.floor))].sort((a,b)=>a-b);
const inF=f=>S.rooms.filter(r=>r.floor===f);
const done=r=>r.st==='O'||r.st==='X';
const stat=rs=>{const t=rs.length,d=rs.filter(done).length;return{t,d,p:t?Math.round(d/t*100):0}};
const shown=()=>{const all=floors();return S.onlyMine&&S.mine.length?all.filter(f=>S.mine.includes(f)):all};
/* 다음 층 규칙: 고층→저층(아래로) 진행. 바로 아래 층이 이미 끝났거나 없으면 위쪽 미완료 층으로, 위쪽도 없으면 남은 아래층으로 */
function nextFloor(cur){
  const fl=shown().slice().sort((a,b)=>a-b),open=f=>stat(inF(f)).p<100,i=fl.indexOf(cur);
  const below=i>0?fl[i-1]:null;
  if(below!==null&&open(below))return below;
  const up=fl.filter(f=>f>cur&&open(f))[0];if(up!==undefined)return up;
  const down=fl.filter(f=>f<cur&&open(f)).pop();return down!==undefined?down:null;
}
/* 층 완료: 가운데 알럿 후 다음 층으로 자동 이동 */
let fdoneTimer=null,autoT=null;
function armFloorAuto(f){
  clearTimeout(autoT);
  if(view.page!=='floor'||view.floor!==f||stat(inF(f)).p<100||document.getElementById('fdone'))return;
  const g=document.querySelector('.dock .big.go');if(g){g.classList.remove('arm');void g.offsetWidth;g.classList.add('arm')}
  const tick=()=>{if(view.page!=='floor'||view.floor!==f||stat(inF(f)).p<100||document.getElementById('fdone'))return;const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'){autoT=setTimeout(tick,1500);return}completeFloor(f)};
  autoT=setTimeout(tick,3500);
}
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT'){clearTimeout(autoT);const g=document.querySelector('.dock .big.go');if(g)g.classList.remove('arm')}});
document.addEventListener('focusout',e=>{if(e.target.tagName==='INPUT'&&view.page==='floor')setTimeout(()=>armFloorAuto(view.floor),50)});
function completeFloor(f){
  clearTimeout(autoT);
  if(document.getElementById('fdone'))return;
  const nf=nextFloor(f);
  const el=document.createElement('div');el.id='fdone';el.className='fdone';
  el.innerHTML=`<div class="box"><div class="t">🎉 ${f}층 점검 완료</div><div class="s">${nf!==null?nf+'층으로 이동해요':'담당 층을 모두 마쳤어요'}</div><div class="h">화면을 누르면 바로 이동</div></div>`;
  document.body.appendChild(el);
  const go=()=>{clearTimeout(fdoneTimer);el.remove();
    if(nf===null){view={page:'home'};render();window.scrollTo(0,0);return}
    view={page:'floor',floor:nf};render();window.scrollTo(0,0);const first=inF(nf).find(x=>!done(x));if(first)goRoom(first.id)};
  el.onclick=go;fdoneTimer=setTimeout(go,1600);
}

function render(){
  const a=document.getElementById('app');
  a.innerHTML=view.page==='home'?home():floor();
  window.scrollTo(0,view.page==='home'?(view.sy||0):0);
}
const hasRep=r=>!!r.rep||SUP.some(([k])=>(r.sup[k]||0)>0);
function gaugeTop(st,label){return`<div class="gauge"><i style="width:${st.p}%"></i></div><div class="gl"><span>${label}</span><span><b>${st.p}%</b> (${st.d}/${st.t})</span></div>`}

function home(){
  const fl=shown(),all=stat(S.rooms),mineRooms=S.mine.length?stat(S.rooms.filter(r=>S.mine.includes(r.floor))):null;
  const nf=[...fl].reverse().find(f=>stat(inF(f)).p<100);
  let h=`<div class="top"><div class="row"><button class="ico" data-a="exit" aria-label="뒤로가기">←</button><h1>회의실 점검</h1><div class="hbtns"><button class="hb sv" data-a="tempsave">임시<br>저장</button><button class="hb" data-a="menu">설정</button></div></div>
  ${mineRooms?gaugeTop(mineRooms,'담당 점검률'+(S.who?' · '+esc(S.who):'')):gaugeTop(all,'전체 점검률')}${mineRooms?`<div class="gl"><span>전체 (3명 합산, 이 폰 기준)</span><span><b style="font-size:17px">${all.p}%</b> (${all.d}/${all.t})</span></div>`:''}</div><div class="wrap">`;
  if(!storeOk)h+=`<div class="card" style="background:#fde4e4;font-size:17px;line-height:1.5"><b>⚠ 이 브라우저는 기록을 저장하지 못해요</b><br>크롬 같은 기본 브라우저로 열어 주세요. 그전까지는 이 창을 닫지 말고, 중간중간 [엑셀 내보내기]로 받아 두세요.</div>`;
  else if(location.protocol==='file:'&&!S.tipOk)h+=`<div class="card" style="background:#fff;font-size:17px;line-height:1.5;border:2px solid var(--ink)"><b>📱 파일로 열었어요</b><br>기록은 이 폰의 브라우저에 저장돼요. 같은 파일을 같은 브라우저로 다시 열어야 이어서 쓸 수 있어요. 중간에 [임시 저장]과 [엑셀 내보내기]를 눌러 두세요.<button class="btn" style="display:block;width:100%;height:50px;border-radius:14px;background:var(--ink);color:#fff;font-size:19px;font-weight:700;margin-top:10px" data-a="tipok">확인했어요</button></div>`;
  if(!S.siteSet)h+=`<button class="card floor next" style="margin-bottom:14px;background:var(--lime)" data-a="pickSite"><span class="n" style="font-size:24px">🏢</span><span class="m" style="font-size:24px;font-weight:800">사옥 선택하기<small style="margin:4px 0 0">눌러서 점검할 사옥을 골라 주세요</small></span></button>`;
  const mainP=(mineRooms||all).p;
  if(mainP===100)h+=`<div class="final">🎉 ${mineRooms?'담당 층 ':'전체 '}점검 완료<b>${mainP}%</b>하단 [내보내기]로 파일을 만들어 주세요</div>`;
  if(S.mine.length)h+=`<div class="chips" style="margin-bottom:12px"><button class="chip ${S.onlyMine?'':'on'}" data-a="scope" data-v="0">전체 층</button><button class="chip ${S.onlyMine?'on':''}" data-a="scope" data-v="1">담당 층만</button></div>`;
  if(S.siteSet&&!S.rooms.length)h+=`<div class="card" style="background:#fff;border:2px solid var(--ink);line-height:1.55"><b style="font-size:21px">${esc(S.site)} 회의실 정보가 아직 없어요</b><br><span style="font-size:17px;color:var(--g6)">점검표 엑셀을 업로드하면 층과 회의실이 자동으로 채워져요.</span><button class="btn" style="display:block;width:100%;height:60px;border-radius:16px;background:var(--lime);color:var(--ink);font-size:21px;font-weight:800;margin-top:12px;border:2px solid var(--ink)" onclick="mergeUI()">📂 회의실 정보 업로드</button></div>`;
  [...fl].reverse().forEach(f=>{const s=stat(inF(f)),mine=S.mine.includes(f);
    h+=`<button class="card floor ${s.p===100?'done':''} ${f===nf?'next':''}" data-a="floor" data-f="${f}"><span class="n">${f}층</span><span class="m"><small>${s.d}/${s.t}실 · ${s.p}%${mine?'<span class="tag">담당</span>':''}${f===nf?'<span class="tag">여기부터</span>':''}${s.p===100?' ✔':''}</small><div class="mini"><i style="width:${s.p}%"></i></div></span></button>`});
  h+=`<button class="ghost" data-a="addFloor">＋ 층 추가</button></div>
  <div class="dock"><div><button class="big xl" data-a="export"><span>📤 점검표 엑셀 내보내기 · 공유</span><small>O ${S.rooms.filter(r=>r.st==='O').length}실 · 진행 ${all.p}% · 눌러서 파일 만들고 메신저로 보내기</small></button></div></div>`;
  return h;
}

function floor(){
  const f=view.floor,rs=inF(f),s=stat(rs),nf=nextFloor(f);
  let h=`<div class="top"><div class="row"><button class="ico" data-a="back" aria-label="뒤로">←</button><h1>${f}층</h1><div class="hbtns"><button class="hb sv" data-a="tempsave">임시<br>저장</button><button class="hb" data-a="menu">설정</button></div></div>${gaugeTop(s,f+'층 진행')}<div class="rnav">${(()=>{const nx=rs.find(r=>!done(r));return rs.map(r=>`<button class="rc ${r.st==='O'?'o':r.st==='X'?'x':''} ${nx&&nx.id===r.id?'nx':''}" data-a="goto" data-id="${r.id}">${esc(r.name)}</button>`).join('')})()}</div></div><div class="wrap">`;
  rs.forEach(r=>{

}

  const totRow=4+fl.length,lastDataAll=blocks.reduce((s,b)=>s+b.length+3,0);
  blocks.forEach((b,bi)=>{

    rowsX.push(`<row r="${t}" ht="20.15" customHeight="1">${cell('B',t,4,bi===0?`${S.site} 회의실 점검 (${mm}월)`:'')}${'CDEFGHI'.split('').map(c=>cell(c,t,4,'')).join('')}${cell('J',t,4,'소모품 보충')}${'KLM'.split('').map(c=>cell(c,t,4,'')).join('')}</row>`);

    rowsX.push(`<row r="${t3}" ht="30.65" customHeight="1">${HEAD.map((h,i)=>cell('BCDEFGHIJKLMN'[i],t3,5,h)).join('')}${bi===0?cell('P',t3,6,'층')+cell('Q',t3,6,'회의실 개수')+cell('R',t3,6,'비고'):''}</row>`);
    const d0=rn+1;
    b.forEach((r,i)=>{const n=++rn,k=n-d0,ser=serial(r.at);let ex='';
      if(bi===0){if(k<fl.length){ex=cell('P',n,6,fl[k])+`<c r="Q${n}" s="6"><f>COUNTIF($F$4:$F$${lastDataAll},P${n})</f><v>${inF(fl[k]).length}</v></c>`+cell('R',n,6,'')}
        else if(k===fl.length){ex=cell('P',n,6,'합계')+`<c r="Q${n}" s="6"><f>SUM(Q4:Q${n-1})</f><v>${S.rooms.length}</v></c>`+cell('R',n,6,'')}}
      rowsX.push(`<row r="${n}" ht="20.15" customHeight="1">${cell('B',n,6,++no)}${ser?`<c r="C${n}" s="7"><v>${ser}</v></c>`:cell('C',n,7,'')}${cell('D',n,6,r.st?(r.by||''):'')}${cell('E',n,6,S.site)}${cell('F',n,6,r.floor)}${cell('G',n,6,r.name)}${cell('H',n,6,r.st)}${cell('I',n,6,r.st==='X'?r.reason:(r.st==='O'?r.memo:''))}${SUP.map(([k],j)=>cell('JKLM'[j],n,6,r.st==='O'&&r.sup[k]?r.sup[k]:'')).join('')}${cell('N',n,6,r.corp)}${ex}</row>`)});
    dv.push([d0,rn]);if(bi<blocks.length-1)brk.push(rn);lastRow=rn;
  });
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="0"/></sheetPr><sheetViews><sheetView showGridLines="0" tabSelected="1" zoomScale="85" zoomScaleNormal="85" workbookViewId="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultColWidth="9" defaultRowHeight="20.15" customHeight="1"/><cols><col min="1" max="1" width="9" style="1"/><col min="2" max="2" width="5.33" style="1" customWidth="1"/><col min="3" max="3" width="12.5" style="1" customWidth="1"/><col min="4" max="4" width="11.33" style="1" customWidth="1"/><col min="5" max="5" width="13" style="1" customWidth="1"/><col min="6" max="6" width="8.5" style="1" customWidth="1"/><col min="7" max="7" width="12" style="1" customWidth="1"/><col min="8" max="8" width="11.75" style="1" customWidth="1"/><col min="9" max="9" width="24" style="1" customWidth="1"/><col min="10" max="13" width="10.58" style="1" customWidth="1"/><col min="14" max="14" width="16.08" style="1" customWidth="1"/><col min="15" max="15" width="9" style="1"/><col min="16" max="16" width="4.08" style="1" hidden="1" customWidth="1"/><col min="17" max="17" width="9.58" style="1" hidden="1" customWidth="1"/><col min="18" max="18" width="4.5" style="1" hidden="1" customWidth="1"/><col min="19" max="16384" width="9" style="1"/></cols><sheetData>${rowsX.join('')}</sheetData><mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells><dataValidations count="2"><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${dv.map(([a,z])=>`H${a}:H${z}`).join(' ')}"><formula1>"O,X"</formula1></dataValidation><dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="0" sqref="${dv.map(([a,z])=>`I${a}:I${z}`).join(' ')}"><formula1>"${REASONS.join(',')}"</formula1></dataValidation></dataValidations><printOptions horizontalCentered="1" verticalCentered="1"/><pageMargins left="0.25" right="0.25" top="0.75" bottom="0.75" header="0.3" footer="0.3"/><pageSetup paperSize="9" scale="47" orientation="portrait"/>${brk.length?`<rowBreaks count="${brk.length}" manualBreakCount="${brk.length}">${brk.map(b=>`<brk id="${b}" min="1" max="13" man="1"/>`).join('')}</rowBreaks>`:''}</worksheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="회의실" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">회의실!$B$1:$N$${lastRow}</definedName></definedNames></workbook>`;
  return zip([
   ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
   ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml',wb],
   ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
   ['xl/styles.xml',STYLES],
   ['xl/worksheets/sheet1.xml',sheet]]);
}
function exportX(){
  if(!S.siteSet){pickSite(exportX);return}
  if(!S.rooms.length){toast('회의실 정보가 없어서 내보낼 수 없어요');return}
  const all=stat(S.rooms),ym=S.ym||today().slice(0,7),mm=parseInt(ym.slice(5,7));
  const defName=`회의실_${mm}월_${S.site}`,blob=buildXlsx();
  const curName=()=>{let n=(document.getElementById('fname').value||defName).replace(/[\\\/:*?"<>|]/g,'').replace(/\.xlsx$/i,'').trim()||defName;return n+'.xlsx'};
  const mkFile=()=>new File([blob],curName(),{type:blob.type});
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=curName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('파일을 저장했어요')};
  const can=!!(navigator.canShare&&navigator.canShare({files:[mkFile()]})),okN=S.rooms.filter(r=>r.st==='O').length;
  const pct=all.t?(okN/all.t*100).toFixed(1):'0.0';
  sheet(`<h2>내보내기 · 공유</h2><div class="final" style="padding:10px"><b style="font-size:38px">${pct}%</b>점검 완료율 (O ${okN}실 / 전체 ${all.t}실)</div>
   <div class="note">점검 진행(O+X): ${all.p}%${all.p<100?` · 아직 ${all.t-all.d}실 미확인 (그대로 보내도 취합 때 이어서 합칠 수 있어요)`:''}</div>
   <label>파일 이름 (.xlsx는 자동으로 붙어요)</label><input type="text" id="fname" value="${esc(defName)}">
   ${can?`<button class="btn pri" id="shbtn" style="height:72px;font-size:21px">📤 공유하기 (사내 메신저 선택)</button><div class="note">누르면 휴대폰 공유창이 열려요. 사내 메신저를 골라 바로 전송하세요. 파일 저장은 필요 없어요.</div>`
     :`<div class="note">⚠ 이 기기·브라우저는 파일 바로 공유를 지원하지 않아요. 파일로 저장한 뒤 메신저에 첨부해 주세요.</div>`}
   <button class="btn ${can?'':'pri'}" id="dlbtn">💾 파일로 저장 (공유가 안 될 때)</button><button class="btn" onclick="closeLayer()">닫기</button>`);
  document.getElementById('dlbtn').onclick=dl;
  const sb=document.getElementById('shbtn');if(sb)sb.onclick=()=>{const fl=mkFile();navigator.share({files:[fl],title:fl.name,text:`${fl.name} · 점검 완료율 ${pct}% (O ${okN}/${all.t}실)`}).catch(()=>{})};
}

/* ---------- XLSX 읽기 + 취합 ---------- */
async function inflate(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},dec=new TextDecoder();
  for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true),ds=lo+30+lnl+lxl,raw=u.subarray(ds,ds+cs);
    if(/^xl\/(worksheets\/sheet\d+\.xml|sharedStrings\.xml|workbook\.xml)$/.test(name))out[name]=dec.decode(m===0?raw:await inflate(raw))}
  return out;
}
async function readRooms(buf){
  const z=await unzip(buf),P=new DOMParser();let ss=[];
  if(z['xl/sharedStrings.xml'])ss=[...P.parseFromString(z['xl/sharedStrings.xml'],'text/xml').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  const sn=Object.keys(z).filter(k=>/worksheets\/sheet\d+/.test(k)).sort(),res=[];let cols=null;
  for(const k of sn){cols=null;const doc=P.parseFromString(z[k],'text/xml');
    for(const row of doc.getElementsByTagName('row')){const m={};
      for(const c of row.getElementsByTagName('c')){const col=c.getAttribute('r').replace(/\d/g,''),t=c.getAttribute('t');let v='';
        if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else{const ve=c.getElementsByTagName('v')[0];if(ve){v=ve.textContent;if(t==='s')v=ss[+v]}}
        m[col]=String(v).trim()}
      const vals=Object.entries(m);const hf=vals.find(([,v])=>v==='층수'),hn=vals.find(([,v])=>v==='회의실 명');
      if(hf&&hn){cols={};vals.forEach(([c,v])=>cols[v]=c);continue}
      if(!cols||!cols['층수'])continue;const f=parseInt(m[cols['층수']]),n=m[cols['회의실 명']];if(!f||!n)continue;
      const g=h=>cols[h]?(m[cols[h]]||''):'';
      const st=g('점검여부').toUpperCase(),rs=g('미점검/출입불가 사유');let at=g('점검일');
      if(/^\d{5}$/.test(at)){const d=new Date((+at-25569)*86400000);at=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
      res.push({floor:f,name:n,corp:g('법인'),st,reason:st==='X'?rs:'',by:g('담당자'),at,memo:st==='O'?(g('특이사항')||rs):'',
        sup:{b:+g('검정')||0,bl:+g('파랑')||0,r:+g('빨강')||0,e:+g('지우개')||0}})}}
  return res;
}
function mergeUI(){
  sheet(`<h2>🧩 점검 파일 취합</h2><div class="note">다른 담당자가 내보낸 엑셀 파일을 선택하세요(여러 개 가능). 아직 점검 안 한 칸만 채워지고, 이미 점검한 칸은 유지돼요. 원본 점검표처럼 담당자별로 나뉜 파일도 읽어요.</div>
  <input type="file" id="mf" accept=".xlsx" multiple style="width:100%;margin-top:8px"><button class="btn pri" onclick="doMerge()">취합하기</button><div id="mres"></div><button class="btn" onclick="menu()">뒤로</button>`);
}
async function doMerge(){
  const fs=[...document.getElementById('mf').files];if(!fs.length){toast('파일을 선택하세요');return}
  let add=0,fill=0,same=0,conf=[];const out=document.getElementById('mres');out.innerHTML='<div class="res">읽는 중…</div>';
  try{for(const f of fs){const rows=await readRooms(await f.arrayBuffer());
    for(const x of rows){let r=S.rooms.find(r=>r.floor===x.floor&&r.name===x.name);
      if(!r){r={id:S.nid++,floor:x.floor,name:x.name,corp:x.corp,st:'',reason:'',sup:{},memo:'',by:'',at:''};S.rooms.push(r);add++}
      if(x.st!=='O'&&x.st!=='X')continue;
      if(!done(r)){Object.assign(r,{st:x.st,reason:x.reason,sup:x.sup,memo:x.memo,by:x.by,at:x.at});fill++}
      else if(r.st===x.st)same++;else conf.push(`${x.floor}층 ${x.name}: 내 ${r.st} / ${f.name} ${x.st}`)}}
    save();const all=stat(S.rooms);
    out.innerHTML=`<div class="res">✅ 채워진 칸 <b>${fill}</b>개 · 새 회의실 ${add}개 · 중복(동일) ${same}개<br>현재 점검률 <b>${all.p}%</b> (${all.d}/${all.t})${conf.length?`<br>⚠ 값이 달라 내 값을 유지한 칸 ${conf.length}개:<br>${conf.slice(0,10).map(esc).join('<br>')}`:''}</div><button class="btn pri" onclick="exportX()">📥 취합본 내보내기</button>`;
  }catch(e){out.innerHTML=`<div class="res">파일을 읽지 못했어요: ${esc(e.message)}</div>`}
}
